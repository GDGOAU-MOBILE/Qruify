name: Build Release Split APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Configure Keystore Signing (if secret provided)
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Configuring release signing key from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
            cat << EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF
          else
            echo "No KEYSTORE_BASE64 secret provided; building with fallback signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: qruify-release-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
